<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://*.facebook.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.fbcdn.net https://*.facebook.com; connect-src 'self' https://graph.facebook.com https://*.facebook.com https://generativelanguage.googleapis.com; frame-src https://*.facebook.com; base-uri 'self'; form-action 'self' https://*.facebook.com; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2546c9">
<title>Sales Agent Facebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
--bg: #f4f5f9; --surface: #ffffff; --ink: #16192b; --muted: #636a85; --line: #e1e4ee;
--brand: #2546c9; --brand-soft: #e8edff; --action: #e4570f; --action-2: #c8320c;
--ok: #157f3b; --ok-soft: #e3f6ea; --warn: #9a5b00; --warn-soft: #fff3dc; --bad: #b42318; --bad-soft: #fde8e6;
--violet: #6b3fd4; --violet-soft: #efe9ff;
--display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
--body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
--r: 14px;
color-scheme: light;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--bg: #0f1120; --surface: #181b2e; --ink: #eef0fa; --muted: #9aa1bd; --line: #2a2e47;
--brand: #7c94ff; --brand-soft: #22294d; --action: #ff7a33; --action-2: #ff5a1f;
--ok: #5fd28a; --ok-soft: #12301f; --warn: #f5b84d; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1714;
--violet: #b79cff; --violet-soft: #2a2148; color-scheme: dark;
}
}
:root[data-theme="dark"] {
--bg: #0f1120; --surface: #181b2e; --ink: #eef0fa; --muted: #9aa1bd; --line: #2a2e47;
--brand: #7c94ff; --brand-soft: #22294d; --action: #ff7a33; --action-2: #ff5a1f;
--ok: #5fd28a; --ok-soft: #12301f; --warn: #f5b84d; --warn-soft: #33270f; --bad: #ff8a80; --bad-soft: #3a1714;
--violet: #b79cff; --violet-soft: #2a2148; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 17px; font-weight: 600; }
a { color: var(--brand); }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; display: grid; gap: 14px; }
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
header.top .bar { max-width: 640px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); text-decoration: none; display: flex; align-items: center; gap: 8px; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--action); display: inline-grid; place-items: center; color: #fff; font-style: normal; font-size: 14px; }
.spacer { flex: 1; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 600; display: grid; justify-items: center; gap: 2px; padding: 8px 2px 9px; position: relative; }
nav.tabs a svg { width: 22px; height: 22px; }
nav.tabs a.on { color: var(--brand); }
nav.tabs .badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--action); color: #fff; border-radius: 99px; font-size: 10px; padding: 0 5px; min-width: 16px; text-align: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 10px 14px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.fb { background: #1877f2; border-color: #1877f2; color: #fff; }
.btn.go { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; border-radius: 9px; }
.mega { width: 100%; border: 0; border-radius: 16px; padding: 18px; font: 800 19px/1 var(--display); letter-spacing: .04em; color: #fff; background: linear-gradient(100deg, var(--action), var(--action-2)); box-shadow: 0 8px 22px color-mix(in srgb, var(--action) 35%, transparent); cursor: pointer; text-decoration: none; display: block; text-align: center; }
.mega:disabled { opacity: .55; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.in { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; color: var(--ink); font-weight: 400; font-size: 15px; }
textarea.in { min-height: 96px; resize: vertical; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.chk input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--brand); flex-shrink: 0; }
.wrap > *, .card > *, .steps > *, .list > *, .grid2 > * { min-width: 0; }
.pill { display: inline-flex; align-items: center; border-radius: 99px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.p-ok { background: var(--ok-soft); color: var(--ok); } .p-warn { background: var(--warn-soft); color: var(--warn); }
.p-bad { background: var(--bad-soft); color: var(--bad); } .p-brand { background: var(--brand-soft); color: var(--brand); }
.p-violet { background: var(--violet-soft); color: var(--violet); } .p-mute { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.note { border-radius: 11px; padding: 10px 12px; font-size: 14px; }
.n-ok { background: var(--ok-soft); color: var(--ok); } .n-warn { background: var(--warn-soft); color: var(--warn); }
.n-bad { background: var(--bad-soft); color: var(--bad); } .n-brand { background: var(--brand-soft); color: var(--brand); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.stat b { display: block; font: 800 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: var(--bg); flex-shrink: 0; border: 1px solid var(--line); }
.thumb.ph { display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.list { display: grid; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.item .t { min-width: 0; flex: 1; display: grid; gap: 2px; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.price { font: 700 17px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.photos figure { margin: 0; position: relative; flex-shrink: 0; }
.photos img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); }
.photos figure button { position: absolute; top: 3px; right: 3px; border: 0; border-radius: 7px; background: rgba(0,0,0,.6); color: #fff; width: 24px; height: 24px; cursor: pointer; }
.photos figure em { position: absolute; left: 3px; bottom: 3px; font-style: normal; font-size: 10px; background: var(--violet); color: #fff; border-radius: 5px; padding: 0 4px; }
.hero { border-radius: 18px; padding: 18px; color: #fff; background: linear-gradient(135deg, #2546c9, #1a2f8f); display: grid; gap: 4px; }
.hero b { font: 800 42px/1 var(--display); font-variant-numeric: tabular-nums; }
.score { width: 46px; text-align: right; flex-shrink: 0; }
.score b { font: 700 18px/1 var(--display); }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; }
.steps { counter-reset: s; display: grid; gap: 12px; }
.step { position: relative; padding-left: 40px; }
.step::before { counter-increment: s; content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-weight: 800; display: grid; place-items: center; }
.step.done::before { content: "✓"; background: var(--ok-soft); color: var(--ok); }
.copyline { display: flex; gap: 8px; align-items: center; font-size: 14px; }
.copyline .v { flex: 1; min-width: 0; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 600; }
details summary { cursor: pointer; color: var(--brand); font-weight: 600; font-size: 14px; }
.pre { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 82px; z-index: 20; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: 92vw; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.modal-bg { position: fixed; inset: 0; background: rgba(10,12,25,.55); z-index: 30; display: grid; place-items: end center; padding: 16px; }
.modal { background: var(--surface); border-radius: 18px; padding: 18px; width: 100%; max-width: 480px; display: grid; gap: 12px; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.sec-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<header class="top"><div class="bar">
<a class="logo" href="#accueil"><i>▲</i>Sales Agent</a><span class="spacer"></span>
<a class="btn sm" href="#reglages" aria-label="Réglages">⚙︎ Réglages</a>
</div></header>
<main id="app" class="wrap" style="padding-top:16px"></main>
<nav class="tabs" id="tabs"></nav>
<div id="overlay"></div>
<script src="a.js"></script>
<script src="b.js"></script>
</body>
</html>
